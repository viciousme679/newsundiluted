<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PivotNews Admin</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;

        color: white;

        background:
          radial-gradient(circle at 20% 20%, #1e3a8a 0%, transparent 30%),
          radial-gradient(circle at 80% 80%, #312e81 0%, transparent 30%),
          linear-gradient(135deg, #020617, #0f172a, #111827);

        overflow-x: hidden;
        position: relative;
      }

      /* =====================================
           ANIMATED BACKGROUND
        ===================================== */

      .background-glow {
        position: fixed;

        width: 500px;
        height: 500px;

        border-radius: 50%;

        background: rgba(37, 99, 235, 0.12);

        filter: blur(80px);

        animation: moveGlow 10s infinite alternate ease-in-out;

        pointer-events: none;
      }

      .glow-one {
        top: -200px;
        left: -150px;
      }

      .glow-two {
        bottom: -200px;
        right: -150px;

        background: rgba(124, 58, 237, 0.12);

        animation-delay: 2s;
      }

      @keyframes moveGlow {
        from {
          transform: translate(0, 0) scale(1);
        }

        to {
          transform: translate(100px, 80px) scale(1.2);
        }
      }

      /* =====================================
           FLOATING PARTICLES
        ===================================== */

      .particles {
        position: fixed;

        inset: 0;

        pointer-events: none;

        overflow: hidden;
      }

      .particle {
        position: absolute;

        width: 4px;
        height: 4px;

        background: rgba(255, 255, 255, 0.5);

        border-radius: 50%;

        animation: floatParticle linear infinite;
      }

      .particle:nth-child(1) {
        left: 10%;
        animation-duration: 8s;
        animation-delay: 1s;
      }

      .particle:nth-child(2) {
        left: 25%;
        animation-duration: 12s;
        animation-delay: 3s;
      }

      .particle:nth-child(3) {
        left: 40%;
        animation-duration: 10s;
        animation-delay: 0s;
      }

      .particle:nth-child(4) {
        left: 55%;
        animation-duration: 14s;
        animation-delay: 2s;
      }

      .particle:nth-child(5) {
        left: 70%;
        animation-duration: 9s;
        animation-delay: 4s;
      }

      .particle:nth-child(6) {
        left: 85%;
        animation-duration: 11s;
        animation-delay: 1s;
      }

      .particle:nth-child(7) {
        left: 95%;
        animation-duration: 13s;
        animation-delay: 5s;
      }

      @keyframes floatParticle {
        0% {
          bottom: -10px;

          opacity: 0;

          transform: translateX(0);
        }

        20% {
          opacity: 1;
        }

        80% {
          opacity: 1;
        }

        100% {
          bottom: 110%;

          opacity: 0;

          transform: translateX(80px);
        }
      }

      /* =====================================
           MAIN WRAPPER
        ===================================== */

      .page-wrapper {
        width: 100%;
        max-width: 1000px;

        min-height: 600px;

        display: grid;

        grid-template-columns: 1fr 1fr;

        position: relative;

        z-index: 10;

        border: 1px solid rgba(255, 255, 255, 0.12);

        border-radius: 30px;

        overflow: hidden;

        background: rgba(255, 255, 255, 0.06);

        backdrop-filter: blur(25px);

        -webkit-backdrop-filter: blur(25px);

        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);

        animation: pageAppear 0.8s ease;
      }

      @keyframes pageAppear {
        from {
          opacity: 0;

          transform: translateY(30px) scale(0.97);
        }

        to {
          opacity: 1;

          transform: translateY(0) scale(1);
        }
      }

      /* =====================================
           BRAND SIDE
        ===================================== */

      .brand-section {
        position: relative;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        text-align: center;

        padding: 50px;

        background: linear-gradient(
          145deg,
          rgba(37, 99, 235, 0.25),
          rgba(30, 41, 59, 0.15)
        );

        border-right: 1px solid rgba(255, 255, 255, 0.1);
      }

      .brand-logo {
        width: 100px;
        height: 100px;

        display: flex;
        justify-content: center;
        align-items: center;

        border-radius: 25px;

        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.2);

        font-size: 45px;

        margin-bottom: 25px;

        box-shadow: 0 0 40px rgba(59, 130, 246, 0.3);

        animation: logoFloat 4s ease-in-out infinite;
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-10px);
        }
      }

      .brand-section h1 {
        font-size: 42px;

        margin-bottom: 15px;

        letter-spacing: -1px;
      }

      .brand-section h1 span {
        color: #60a5fa;
      }

      .brand-section p {
        max-width: 350px;

        color: #cbd5e1;

        line-height: 1.7;

        font-size: 16px;
      }

      .brand-line {
        width: 70px;
        height: 4px;

        background: #3b82f6;

        border-radius: 10px;

        margin: 25px auto;

        box-shadow: 0 0 15px rgba(59, 130, 246, 0.7);
      }

      /* =====================================
           LOGIN SECTION
        ===================================== */

      .auth-section {
        display: flex;

        justify-content: center;
        align-items: center;

        padding: 45px;

        background: rgba(2, 6, 23, 0.35);
      }

      .auth-box {
        width: 100%;

        max-width: 380px;
      }

      .auth-box h2 {
        font-size: 30px;

        margin-bottom: 8px;
      }

      .auth-subtitle {
        color: #94a3b8;

        margin-bottom: 30px;

        line-height: 1.5;
      }

      /* =====================================
           INPUTS
        ===================================== */

      .input-group {
        position: relative;

        margin-bottom: 18px;
      }

      .input-group input {
        width: 100%;

        height: 55px;

        padding: 0 48px 0 45px;

        border: 1px solid rgba(255, 255, 255, 0.12);

        border-radius: 14px;

        outline: none;

        background: rgba(255, 255, 255, 0.07);

        color: white;

        font-size: 15px;

        transition: 0.3s;
      }

      .input-group input::placeholder {
        color: #94a3b8;
      }

      .input-group input:focus {
        border-color: #3b82f6;

        background: rgba(255, 255, 255, 0.1);

        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
      }

      .input-icon {
        position: absolute;

        left: 16px;

        top: 50%;

        transform: translateY(-50%);

        font-size: 18px;

        color: #94a3b8;

        pointer-events: none;
      }

      /* PASSWORD EYE */

      .password-toggle {
        position: absolute;

        right: 15px;

        top: 50%;

        transform: translateY(-50%);

        border: none;

        background: transparent;

        color: #94a3b8;

        cursor: pointer;

        font-size: 17px;

        padding: 5px;

        width: auto;

        margin: 0;
      }

      .password-toggle:hover {
        color: white;

        background: transparent;
      }

      /* =====================================
           MAIN BUTTON
        ===================================== */

      #mainBtn {
        width: 100%;

        height: 55px;

        border: none;

        border-radius: 14px;

        background: linear-gradient(135deg, #2563eb, #4f46e5);

        color: white;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        margin-top: 5px;

        margin-bottom: 12px;

        position: relative;

        overflow: hidden;

        transition: 0.3s;

        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
      }

      #mainBtn::before {
        content: "";

        position: absolute;

        top: 0;

        left: -100%;

        width: 100%;

        height: 100%;

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.25),
          transparent
        );

        transition: 0.5s;
      }

      #mainBtn:hover::before {
        left: 100%;
      }

      #mainBtn:hover {
        transform: translateY(-2px);

        box-shadow: 0 15px 30px rgba(37, 99, 235, 0.35);
      }

      #mainBtn:active {
        transform: scale(0.98);
      }

      /* =====================================
           SWITCH BUTTON
        ===================================== */

      .switch-btn {
        width: 100%;

        height: 48px;

        border: 1px solid rgba(255, 255, 255, 0.12);

        border-radius: 12px;

        background: rgba(255, 255, 255, 0.06);

        color: #cbd5e1;

        cursor: pointer;

        font-size: 14px;

        transition: 0.3s;
      }

      .switch-btn:hover {
        background: rgba(255, 255, 255, 0.1);

        color: white;
      }

      /* =====================================
           MESSAGE
        ===================================== */

      .message {
        min-height: 25px;

        text-align: center;

        margin-top: 18px;

        font-size: 14px;

        color: #f87171;

        animation: messageAppear 0.3s ease;
      }

      @keyframes messageAppear {
        from {
          opacity: 0;

          transform: translateY(-5px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }

      /* =====================================
           MOBILE
        ===================================== */

      @media (max-width: 800px) {
        body {
          padding: 15px;
        }

        .page-wrapper {
          grid-template-columns: 1fr;

          max-width: 500px;

          min-height: auto;
        }

        .brand-section {
          padding: 35px 25px;

          border-right: none;

          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-logo {
          width: 75px;
          height: 75px;

          font-size: 34px;

          margin-bottom: 15px;
        }

        .brand-section h1 {
          font-size: 30px;
        }

        .brand-section p {
          font-size: 14px;
        }

        .brand-line {
          margin: 18px auto;
        }

        .auth-section {
          padding: 35px 25px;
        }

        .auth-box h2 {
          font-size: 26px;
        }
      }

      @media (max-width: 420px) {
        body {
          padding: 10px;
        }

        .page-wrapper {
          border-radius: 22px;
        }

        .brand-section {
          padding: 30px 20px;
        }

        .brand-section h1 {
          font-size: 27px;
        }

        .auth-section {
          padding: 30px 18px;
        }

        .auth-box h2 {
          font-size: 24px;
        }

        .input-group input {
          height: 52px;
        }

        #mainBtn {
          height: 52px;
        }
      }
    </style>
  </head>

  <body>
    <!-- BACKGROUND GLOWS -->

    <div class="background-glow glow-one"></div>

    <div class="background-glow glow-two"></div>

    <!-- PARTICLES -->

    <div class="particles">
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>

    <!-- MAIN -->

    <div class="page-wrapper">
      <!-- BRAND -->

      <section class="brand-section">
        <div class="brand-logo">📰</div>

        <h1>The<span> PivotNews</span></h1>

        <div class="brand-line"></div>

        <p>
          Your trusted space for staying informed, discovering stories and
          managing the latest news from one place.
        </p>
      </section>

      <!-- AUTH -->

      <section class="auth-section">
        <div class="auth-box">
          <h2 id="title">Admin Login</h2>

          <p class="auth-subtitle" id="authSubtitle">
            Sign in to access your PivotNews dashboard.
          </p>

          <!-- NAME -->

          <div class="input-group" id="nameGroup" style="display: none">
            <span class="input-icon">👤</span>

            <input
              type="text"
              id="name"
              placeholder="Full Name"
              autocomplete="name"
            />
          </div>

          <div class="input-group">
            <span class="input-icon"> 👤 </span>

            <input
              type="email"
              id="username"
              placeholder="Email Address"
              autocomplete="username"
            />
          </div>

          <!-- PASSWORD -->

          <div class="input-group">
            <span class="input-icon"> 🔒 </span>

            <input
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="current-password"
            />

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              onclick="togglePassword()"
            >
              👁️
            </button>
          </div>

          <!-- LOGIN -->

          <button onclick="submitForm()" id="mainBtn">Login</button>

          <!-- SWITCH -->

          <button class="switch-btn" onclick="toggleMode()" id="switchBtn">
            Create Account
          </button>

          <!-- MESSAGE -->

          <p class="message" id="message"></p>
        </div>
      </section>
    </div>

    <script type="module">
  // =========================================
  // FIREBASE IMPORTS
  // =========================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile,
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc,
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


  // =========================================
  // FIREBASE CONFIG
  // =========================================

  const firebaseConfig = {
    apiKey: "AIzaSyB06tEmKKCLeA8bOhTWb_wE08I8V-1DduM",
    authDomain: "sunraynews-5443b.firebaseapp.com",
    projectId: "sunraynews-5443b",
    storageBucket: "sunraynews-5443b.firebasestorage.app",
    messagingSenderId: "1061115545146",
    appId: "1:1061115545146:web:f3a70f1efb304637809703",
    measurementId: "G-3WT5TKZW27",
  };


  // =========================================
  // INITIALIZE FIREBASE
  // =========================================

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  // =========================================
  // PASSWORD TOGGLE
  // =========================================

  window.togglePassword = function () {
    const password = document.getElementById("password");
    const toggle = document.getElementById("passwordToggle");

    if (password.type === "password") {
      password.type = "text";
      toggle.innerHTML = "🙈";
    } else {
      password.type = "password";
      toggle.innerHTML = "👁️";
    }
  };


  // =========================================
  // LOGIN / SIGNUP MODE
  // =========================================

  let loginMode = true;


  window.toggleMode = function () {
    loginMode = !loginMode;

    const title = document.getElementById("title");
    const mainBtn = document.getElementById("mainBtn");
    const switchBtn = document.getElementById("switchBtn");
    const message = document.getElementById("message");
    const subtitle = document.getElementById("authSubtitle");

    const password = document.getElementById("password");

    // Name field
    const nameInput = document.getElementById("name");


    // Clear previous message
    message.innerHTML = "";


    // =========================================
    // LOGIN MODE
    // =========================================

    if (loginMode) {

      title.innerHTML = "Admin Login";

      mainBtn.innerHTML = "Login";

      switchBtn.innerHTML = "Create Account";

      subtitle.innerHTML =
        "Sign in to access your PivotNews dashboard.";

      password.setAttribute(
        "autocomplete",
        "current-password"
      );


      // Hide name field during login
      if (nameInput) {
        nameInput.parentElement.style.display = "none";
      }

    }


    // =========================================
    // SIGNUP MODE
    // =========================================

    else {

      title.innerHTML = "Create Account";

      mainBtn.innerHTML = "Sign Up";

      switchBtn.innerHTML = "Back To Login";

      subtitle.innerHTML =
        "Create your PivotNews administrator account.";

      password.setAttribute(
        "autocomplete",
        "new-password"
      );


      // Show name field during signup
      if (nameInput) {
        nameInput.parentElement.style.display = "flex";
      }

    }


    password.value = "";
  };


  // =========================================
  // MAIN FORM ACTION
  // =========================================

  window.submitForm = async function () {

    const emailInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const nameInput =
      document.getElementById("name");

    const message =
      document.getElementById("message");

    const mainBtn =
      document.getElementById("mainBtn");


    // =========================================
    // GET VALUES
    // =========================================

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value.trim();

    const name =
      nameInput ? nameInput.value.trim() : "";


    // =========================================
    // EMPTY EMAIL/PASSWORD
    // =========================================

    if (!email || !password) {

      message.innerHTML =
        "Please fill in all required fields.";

      message.style.color = "#f87171";

      return;
    }


    // =========================================
    // SIGNUP NAME CHECK
    // =========================================

    if (!loginMode && !name) {

      message.innerHTML =
        "Please enter your full name.";

      message.style.color = "#f87171";

      return;
    }


    // =========================================
    // LOGIN
    // =========================================

    if (loginMode) {

      try {

        mainBtn.innerHTML =
          "Signing In...";

        mainBtn.disabled = true;


        // Firebase Authentication login
        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        // =========================================
        // CHECK IF USER EXISTS IN ADMINS
        // =========================================

        const adminsSnapshot =
          await getDocs(
            collection(db, "admins")
          );


        let adminFound = false;


        adminsSnapshot.forEach((adminDoc) => {

          const adminData =
            adminDoc.data();


          if (
            adminData.email === user.email
          ) {

            adminFound = true;

          }

        });


        // =========================================
        // NOT AN ADMIN
        // =========================================

        if (!adminFound) {

          await auth.signOut();

          message.style.color =
            "#f87171";

          message.innerHTML =
            "You are not authorized to access the admin dashboard.";

          mainBtn.innerHTML =
            "Login";

          mainBtn.disabled = false;

          return;
        }


        // =========================================
        // LOGIN SUCCESS
        // =========================================

        mainBtn.innerHTML =
          "✓ Login Successful";

        mainBtn.style.background =
          "linear-gradient(135deg,#16a34a,#15803d)";

        message.style.color =
          "#4ade80";

        message.innerHTML =
          "Welcome back!";


        // Save login state
        localStorage.setItem(
          "adminLoggedIn",
          "true"
        );


        // Save current admin name
        localStorage.setItem(
          "currentAdmin",
          user.displayName || "Admin"
        );


        // Redirect
        setTimeout(() => {

          window.location.href =
            "admin.html";

        }, 500);


      } catch (error) {

        console.error(
          "FIREBASE LOGIN ERROR:",
          error
        );


        mainBtn.innerHTML =
          "Login";

        mainBtn.disabled = false;


        message.style.color =
          "#f87171";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message.innerHTML =
            "Incorrect email or password.";

        } else if (
          error.code ===
          "auth/user-not-found"
        ) {

          message.innerHTML =
            "No account was found with this email.";

        } else if (
          error.code ===
          "auth/wrong-password"
        ) {

          message.innerHTML =
            "Incorrect password.";

        } else {

          message.innerHTML =
            error.code +
            "<br>" +
            error.message;

        }

      }

      return;
    }


    // =========================================
    // CREATE ACCOUNT
    // =========================================

    try {

      mainBtn.innerHTML =
        "Checking admin limit...";

      mainBtn.disabled = true;


      // =========================================
      // GET CURRENT ADMINS
      // =========================================

      const adminsSnapshot =
        await getDocs(
          collection(db, "admins")
        );


      // Maximum 10 admins
      if (adminsSnapshot.size >= 10) {

        mainBtn.innerHTML =
          "Sign Up";

        mainBtn.disabled = false;

        message.style.color =
          "#f87171";

        message.innerHTML =
          "Admin registration is currently full. Maximum of 10 admins allowed.";

        return;
      }


      // =========================================
      // CREATE FIREBASE AUTH ACCOUNT
      // =========================================

      mainBtn.innerHTML =
        "Creating Account...";


      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        userCredential.user;


      console.log(
        "FIREBASE AUTHENTICATION SUCCESS:",
        user
      );


      // =========================================
      // SAVE NAME TO FIREBASE AUTH
      // =========================================

      await updateProfile(user, {
        displayName: name
      });


      console.log(
        "NAME SAVED TO FIREBASE AUTH:",
        name
      );


      // =========================================
      // SAVE ADMIN TO FIRESTORE
      // =========================================

      mainBtn.innerHTML =
        "Saving admin information...";


      await setDoc(
        doc(db, "admins", user.uid),
        {
          name: name,

          email: user.email,

          uid: user.uid,

          createdAt:
            new Date().toISOString()
        }
      );


      console.log(
        "ADMIN INFORMATION SAVED TO FIRESTORE"
      );


      // =========================================
      // SUCCESS
      // =========================================

      mainBtn.innerHTML =
        "✓ Account Created";

      mainBtn.style.background =
        "linear-gradient(135deg,#16a34a,#15803d)";

      message.style.color =
        "#4ade80";

      message.innerHTML =
        "Account created successfully!";


      // Save current admin name locally
      localStorage.setItem(
        "currentAdmin",
        name
      );


      // =========================================
      // RETURN TO LOGIN
      // =========================================

      setTimeout(() => {

        toggleMode();

        mainBtn.disabled = false;

        mainBtn.style.background = "";

      }, 1000);


    } catch (error) {

      console.error(
        "ACCOUNT CREATION ERROR:",
        error
      );


      mainBtn.innerHTML =
        "Sign Up";

      mainBtn.disabled = false;

      message.style.color =
        "#f87171";


      if (
        error.code ===
        "auth/email-already-in-use"
      ) {

        message.innerHTML =
          "This email is already registered.";

      } else if (
        error.code ===
        "auth/weak-password"
      ) {

        message.innerHTML =
          "Password is too weak. Use at least 6 characters.";

      } else if (
        error.code ===
        "auth/invalid-email"
      ) {

        message.innerHTML =
          "Please enter a valid email address.";

      } else {

        message.innerHTML =
          error.code +
          "<br>" +
          error.message;

      }

    }

  };


  // =========================================
  // ENTER KEY SUPPORT
  // =========================================

  document
    .getElementById("password")
    .addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          submitForm();

        }

      }
    );


  document
    .getElementById("username")
    .addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          submitForm();

        }

      }
    );


  // =========================================
  // INITIAL STATE
