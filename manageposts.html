<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Posts</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f3f4f6;
        color: #111827;
        transition: 0.3s;
        padding: 20px;
      }

      /* TOPBAR */
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 15px 20px;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .dark-btn {
        border: none;
        background: #111827;
        color: white;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
        transition: 0.3s;
      }

      .dark-btn:hover {
        background: #374151;
      }

      /* TABLE */
      .posts-table {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      th {
        background: #f9fafb;
      }

      /* DARK MODE */
      .dark-mode {
        background: #111827;
        color: white;
      }

      .dark-mode .topbar,
      .dark-mode .posts-table {
        background: #1f2937;
        color: white;
      }

      .dark-mode th {
        background: #374151;
      }

      .dark-mode td {
        border-color: #374151;
      }

      .dark-mode a {
        color: white;
      }

      /* =========================================
   RESPONSIVE - KEEP CURRENT DESIGN
========================================= */

      /* Make page respect screen width */
      html,
      body {
        width: 100%;
        max-width: 100%;
      }

      body {
        overflow-x: hidden;
      }

      /* =========================================
   TABLETS
========================================= */

      @media screen and (max-width: 900px) {
        body {
          padding: 15px;
        }

        .topbar {
          padding: 14px 18px;
        }

        .topbar h2 {
          font-size: 22px;
        }

        .posts-table {
          padding: 15px;
          overflow-x: auto;
        }

        table {
          min-width: 700px;
        }

        th,
        td {
          padding: 10px;
          font-size: 14px;
        }
      }

      /* =========================================
   PHONES
========================================= */

      @media screen and (max-width: 600px) {
        body {
          width: 100%;
          padding: 10px;
          overflow-x: hidden;
        }

        /* TOPBAR */

        .topbar {
          width: 100%;
          padding: 13px;
          margin-bottom: 15px;
          border-radius: 12px;
        }

        .topbar h2 {
          font-size: 19px;
          line-height: 1.3;
        }

        .dark-btn {
          width: 40px;
          height: 40px;
          padding: 7px;
          font-size: 16px;
          flex-shrink: 0;
        }

        /* TABLE CONTAINER */

        .posts-table {
          width: 100%;
          padding: 10px;

          overflow-x: auto;
          overflow-y: hidden;

          -webkit-overflow-scrolling: touch;

          border-radius: 12px;
        }

        /* TABLE */

        table {
          width: 100%;
          min-width: 650px;
          border-collapse: collapse;
        }

        th,
        td {
          padding: 10px;
          font-size: 13px;
          white-space: nowrap;
        }

        /* ACTION BUTTONS */

        td button {
          font-size: 12px !important;
          padding: 7px 10px !important;
          margin-right: 3px !important;
        }
      }

      /* =========================================
   VERY SMALL PHONES
========================================= */

      @media screen and (max-width: 360px) {
        body {
          padding: 7px;
        }

        .topbar {
          padding: 11px;
        }

        .topbar h2 {
          font-size: 18px;
        }

        .posts-table {
          padding: 8px;
        }

        table {
          min-width: 600px;
        }

        th,
        td {
          padding: 8px;
          font-size: 12px;
        }

        td button {
          font-size: 11px !important;
          padding: 6px 8px !important;
        }
      }

      /* ================================
   VIEW POST MODAL
================================ */

      .view-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        padding: 20px;
        overflow-y: auto;
      }

      .view-modal-content {
        background: white;
        width: 100%;
        max-width: 900px;
        margin: 30px auto;
        border-radius: 16px;
        padding: 30px;
        position: relative;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      }

      .view-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
        margin-bottom: 20px;
      }

      .view-modal-header h2 {
        font-size: 30px;
        line-height: 1.3;
      }

      .close-view {
        border: none;
        background: #dc2626;
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
        flex-shrink: 0;
      }

      .view-meta {
        color: #6b7280;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .view-image {
        width: 100%;
        max-height: 400px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 25px;
      }

      .view-content {
        font-size: 16px;
        line-height: 1.8;
        word-wrap: break-word;
      }

      .view-content img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .dark-mode .view-modal-content {
        background: #1f2937;
        color: white;
      }

      .dark-mode .view-meta {
        color: #d1d5db;
      }

      /* MOBILE */

      @media screen and (max-width: 600px) {
        .view-modal {
          padding: 8px;
        }

        .view-modal-content {
          margin: 5px auto;
          padding: 18px;
          border-radius: 12px;
        }

        .view-modal-header h2 {
          font-size: 21px;
        }

        .close-view {
          width: 36px;
          height: 36px;
          font-size: 15px;
        }

        .view-image {
          max-height: 250px;
        }

        .view-content {
          font-size: 14px;
          line-height: 1.7;
        }
      }

      /* ================================
   EDIT POST MODAL
================================ */

      .edit-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10000;
        padding: 20px;
        overflow-y: auto;
      }

      .edit-modal-content {
        background: white;
        width: 100%;
        max-width: 900px;
        margin: 20px auto;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      }

      .edit-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .edit-modal-header h2 {
        font-size: 26px;
      }

      .close-edit {
        border: none;
        background: #dc2626;
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
      }

      .edit-group {
        margin-bottom: 18px;
      }

      .edit-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
      }

      .edit-group input,
      .edit-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
      }

      .edit-group textarea {
        min-height: 220px;
        resize: vertical;
        line-height: 1.7;
      }

      .edit-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      .save-edit {
        background: #16a34a;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 15px;
      }

      .cancel-edit {
        background: #6b7280;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 15px;
      }

      .dark-mode .edit-modal-content {
        background: #1f2937;
        color: white;
      }

      .dark-mode .edit-group input,
      .dark-mode .edit-group textarea {
        background: #374151;
        color: white;
        border-color: #555;
      }

      /* MOBILE */

      @media screen and (max-width: 600px) {
        .edit-modal {
          padding: 8px;
        }

        .edit-modal-content {
          margin: 5px auto;
          padding: 18px;
          border-radius: 12px;
        }

        .edit-modal-header h2 {
          font-size: 21px;
        }

        .edit-group input,
        .edit-group textarea {
          font-size: 14px;
        }

        .edit-actions {
          flex-direction: column;
        }

        .save-edit,
        .cancel-edit {
          width: 100%;
        }
      }

      .edit-editor {
        width: 100%;
        min-height: 300px;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background: white;
        color: #111827;
        outline: none;
        line-height: 1.8;
        overflow-y: auto;
      }

      .edit-editor p {
        margin-bottom: 15px;
      }

      .edit-editor h2 {
        margin: 20px 0 10px;
      }

      .edit-editor h3 {
        margin: 18px 0 10px;
      }

      .edit-editor ul,
      .edit-editor ol {
        margin: 15px 0;
        padding-left: 25px;
      }

      .edit-editor blockquote {
        border-left: 4px solid #111827;
        padding-left: 15px;
        margin: 15px 0;
        color: #6b7280;
        font-style: italic;
      }

      .dark-mode .edit-editor {
        background: #374151;
        color: white;
        border-color: #555;
      }

      @media screen and (max-width: 600px) {
        .edit-editor {
          min-height: 250px;
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <!-- TOP BAR -->
    <div class="topbar">
      <h2>Manage Posts</h2>

      <button id="darkModeBtn" class="dark-btn">🌙</button>
    </div>

    <!-- TABLE -->
    <section class="posts-table">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="postsTable"></tbody>
      </table>
    </section>

    <!-- VIEW POST MODAL -->

    <div id="viewModal" class="view-modal">
      <div class="view-modal-content">
        <div class="view-modal-header">
          <h2 id="viewTitle">Article Title</h2>

          <button class="close-view" onclick="closeViewModal()">✖</button>
        </div>

        <div id="viewMeta" class="view-meta"></div>

        <img id="viewImage" class="view-image" style="display: none" />

        <div id="viewContent" class="view-content"></div>
      </div>
    </div>

    <!-- EDIT POST MODAL -->

    <div id="editModal" class="edit-modal">
      <div class="edit-modal-content">
        <div class="edit-modal-header">
          <h2>✏️ Edit Article</h2>

          <button class="close-edit" onclick="closeEditModal()">✖</button>
        </div>

        <div class="edit-group">
          <label> Article Title </label>

          <input type="text" id="editTitle" placeholder="Article title" />
        </div>

        <div class="edit-group">
          <label> Author </label>

          <input type="text" id="editAuthor" placeholder="Author" />
        </div>

        <div class="edit-group">
          <label> Excerpt </label>

          <textarea id="editExcerpt" placeholder="Article excerpt"></textarea>
        </div>

        <div class="edit-group">
          <label> Article Content </label>

          <div
            id="editContent"
            class="edit-editor"
            contenteditable="true"
          ></div>
        </div>

        <div class="edit-actions">
          <button class="save-edit" id="saveEditBtn">💾 Save Changes</button>

          <button class="cancel-edit" onclick="closeEditModal()">Cancel</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

      import {
        getFirestore,
        collection,
        getDocs,
        deleteDoc,
        doc,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

      // =========================
      // FIREBASE CONFIG
      // =========================

      const firebaseConfig = {
        apiKey: "AIzaSyB06tEmKKCLeA8bOhTWb_wE08I8V-1DduM",

        authDomain: "sunraynews-5443b.firebaseapp.com",

        projectId: "sunraynews-5443b",

        storageBucket: "sunraynews-5443b.firebasestorage.app",

        messagingSenderId: "1061115545146",

        appId: "1:1061115545146:web:f3a70f1efb304637809703",

        measurementId: "G-3WT5TKZW27",
      };

      // =========================
      // INITIALIZE
      // =========================

      const app = initializeApp(firebaseConfig);

      const db = getFirestore(app);

      // =========================
      // LOGIN CHECK
      // =========================

      if (localStorage.getItem("adminLoggedIn") !== "true") {
        window.location.href = "login.html";
      }

      const darkBtn = document.getElementById("darkModeBtn");

      function applyTheme() {
        const mode = localStorage.getItem("darkMode");

        if (mode === "enabled") {
          document.body.classList.add("dark-mode");

          if (darkBtn) darkBtn.textContent = "☀️";
        } else {
          document.body.classList.remove("dark-mode");

          if (darkBtn) darkBtn.textContent = "🌙";
        }
      }

      applyTheme();

      if (darkBtn) {
        darkBtn.addEventListener("click", () => {
          if (document.body.classList.contains("dark-mode")) {
            localStorage.setItem("darkMode", "disabled");
          } else {
            localStorage.setItem("darkMode", "enabled");
          }

          applyTheme();
        });
      }

      // =========================
      // POSTS
      // =========================

      const postsTable = document.getElementById("postsTable");

      let posts = [];

      // =========================
      // LOAD POSTS
      // =========================

      async function loadPosts() {
        posts = [];

        postsTable.innerHTML = `
        <tr>
            <td colspan="4" style="text-align:center;padding:30px;">
                Loading posts...
            </td>
        </tr>
    `;

        const querySnapshot = await getDocs(collection(db, "posts"));

        querySnapshot.forEach((docSnap) => {
          posts.push({
            firebaseId: docSnap.id,

            ...docSnap.data(),
          });
        });

        displayPosts();
      }

      // =========================
      // DISPLAY POSTS
      // =========================

      function displayPosts() {
        postsTable.innerHTML = "";

        // EMPTY
        if (posts.length === 0) {
          postsTable.innerHTML = `
            <tr>
                <td colspan="4" style="text-align:center;padding:30px;">
                    No posts available
                </td>
            </tr>
        `;

          return;
        }

        // POSTS
        posts.forEach((post, index) => {
          postsTable.innerHTML += `

        <tr>

            <td>
                ${post.title}
            </td>

            <td>
                ${post.date || "No Date"}
            </td>

            <td>
                Published
            </td>

            <td>

                <button

                    onclick="viewPost(${index})"

                    style="
                        background:#2563eb;
                        color:white;
                        border:none;
                        padding:8px 12px;
                        border-radius:6px;
                        cursor:pointer;
                        margin-right:5px;
                    "

                >
                    View
                </button>

                <button

                    onclick="editPost(${index})"

                    style="
                        background:#f59e0b;
                        color:white;
                        border:none;
                        padding:8px 12px;
                        border-radius:6px;
                        cursor:pointer;
                        margin-right:5px;
                    "

                >
                    Edit
                </button>

                <button

                    onclick="deletePost(${index})"

                    style="
                        background:#dc2626;
                        color:white;
                        border:none;
                        padding:8px 12px;
                        border-radius:6px;
                        cursor:pointer;
                    "

                >
                    Delete
                </button>

            </td>

        </tr>

        `;
        });
      }

      // =========================
      // VIEW POST
      // =========================

      window.viewPost = function (index) {
        const post = posts[index];

        if (!post) {
          alert("Post not found");
          return;
        }

        document.getElementById("viewTitle").textContent =
          post.title || "Untitled Article";

        document.getElementById("viewMeta").textContent = `By ${
          post.author || "Admin"
        } • ${post.date || "No Date"}`;

        const image = document.getElementById("viewImage");

        if (post.image) {
          image.src = post.image;
          image.style.display = "block";
        } else {
          image.style.display = "none";
        }

        document.getElementById("viewContent").innerHTML =
          post.content || "No article content available.";

        document.getElementById("viewModal").style.display = "block";

        document.body.style.overflow = "hidden";
      };

      window.closeViewModal = function () {
        document.getElementById("viewModal").style.display = "none";

        document.body.style.overflow = "";
      };

      document
        .getElementById("viewModal")
        .addEventListener("click", function (e) {
          if (e.target === this) {
            closeViewModal();
          }
        });

      // =========================
      // EDIT POST
      // =========================

      window.editPost = async function (index) {
        const post = posts[index];

        let editingPost = null;

        window.editPost = function (index) {
          const post = posts[index];

          if (!post) {
            alert("Post not found");
            return;
          }

          editingPost = post;

          document.getElementById("editTitle").value = post.title || "";

          document.getElementById("editAuthor").value = post.author || "";

          document.getElementById("editExcerpt").value = post.excerpt || "";

          document.getElementById("editContent").innerHTML =
    post.content || "";

          document.getElementById("editModal").style.display = "block";

          document.body.style.overflow = "hidden";
        };

        document
          .getElementById("saveEditBtn")
          .addEventListener("click", async function () {
            if (!editingPost) {
              alert("No post selected.");
              return;
            }

            const title = document.getElementById("editTitle").value.trim();

            const author = document.getElementById("editAuthor").value.trim();

            const excerpt = document.getElementById("editExcerpt").value.trim();

            const rawContent = document.getElementById("editContent").innerHTML;

            const content = cleanArticleHTML(rawContent).trim();

            if (!title || !content) {
              alert("Please enter a title and article content.");

              return;
            }

            const saveBtn = document.getElementById("saveEditBtn");

            saveBtn.disabled = true;

            saveBtn.textContent = "Saving...";

            try {
              await updateDoc(
                doc(db, "posts", editingPost.firebaseId),

                {
                  title: title,
                  author: author || "Admin",
                  excerpt: excerpt,
                  content: content,
                }
              );

              alert("Article updated successfully!");

              closeEditModal();

              await loadPosts();
            } catch (error) {
              console.error(error);

              alert("Failed to update article.");
            } finally {
              saveBtn.disabled = false;

              saveBtn.textContent = "💾 Save Changes";
            }
          });

        window.closeEditModal = function () {
          document.getElementById("editModal").style.display = "none";

          document.body.style.overflow = "";

          editingPost = null;
        };

        document
          .getElementById("editModal")
          .addEventListener("click", function (e) {
            if (e.target === this) {
              closeEditModal();
            }
          });

        if (newTitle === null) return;

        const newExcerpt = prompt("Edit Excerpt", post.excerpt);

        if (newExcerpt === null) return;

        const newContent = prompt("Edit Content", post.content);

        if (newContent === null) return;

        try {
          await updateDoc(
            doc(db, "posts", post.firebaseId),

            {
              title: newTitle,

              excerpt: newExcerpt,

              content: newContent,
            }
          );

          alert("Post Updated");

          loadPosts();
        } catch (error) {
          console.error(error);

          alert("Failed to update post");
        }
      };

      // =========================
      // DELETE POST
      // =========================

      window.deletePost = async function (index) {
        const post = posts[index];

        const confirmDelete = confirm("Delete this post?");

        if (!confirmDelete) return;

        try {
          await deleteDoc(doc(db, "posts", post.firebaseId));

          alert("Post Deleted");

          loadPosts();
        } catch (error) {
          console.error(error);

          alert("Failed to delete post");
        }
      };

      // =========================
      // START
      // =========================

      loadPosts();

      function cleanArticleHTML(html) {
        const container = document.createElement("div");

        container.innerHTML = html;

        // Convert divs into paragraphs
        container.querySelectorAll("div").forEach((div) => {
          const p = document.createElement("p");

          p.innerHTML = div.innerHTML;

          div.replaceWith(p);
        });

        return container.innerHTML;
      }
    </script>
  </body>
</html>
